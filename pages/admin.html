<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản Trị — Phản Hồi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../shared/styles.css" />
</head>
<body>
  <script src="../shared/nav.js"></script>

  <div class="page-container">
    <h1>Quản Trị Phản Hồi</h1>

    <!-- Filters -->
    <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-4 mb-5 flex flex-wrap gap-4 items-end">
      <div class="flex flex-col gap-1">
        <label class="text-xs font-medium text-gray-500 uppercase tracking-wide" for="filterLocation">Chi nhánh</label>
        <select id="filterLocation" class="border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-400">
          <option value="">Tất cả chi nhánh</option>
          <option value="Hà Nội">Hà Nội</option>
          <option value="Đà Nẵng">Đà Nẵng</option>
          <option value="TP.HCM">TP.HCM</option>
        </select>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-xs font-medium text-gray-500 uppercase tracking-wide" for="filterRating">Đánh giá tối thiểu</label>
        <select id="filterRating" class="border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-400">
          <option value="1">★ 1 trở lên</option>
          <option value="2">★★ 2 trở lên</option>
          <option value="3">★★★ 3 trở lên</option>
          <option value="4">★★★★ 4 trở lên</option>
          <option value="5">★★★★★ 5 sao</option>
        </select>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-xs font-medium text-gray-500 uppercase tracking-wide" for="filterFrom">Từ ngày</label>
        <input id="filterFrom" type="date" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-xs font-medium text-gray-500 uppercase tracking-wide" for="filterTo">Đến ngày</label>
        <input id="filterTo" type="date" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
      </div>
    </div>

    <div id="tableWrap"></div>
  </div>

  <script>
    function formatDate(isoString) {
      const d = new Date(isoString);
      const dd   = String(d.getDate()).padStart(2, '0');
      const mm   = String(d.getMonth() + 1).padStart(2, '0');
      const yyyy = d.getFullYear();
      const hh   = String(d.getHours()).padStart(2, '0');
      const min  = String(d.getMinutes()).padStart(2, '0');
      return `${dd}/${mm}/${yyyy} ${hh}:${min}`;
    }

    function stars(n) {
      return '★'.repeat(n) + '☆'.repeat(5 - n);
    }

    function rowBg(n) {
      if (n >= 4) return 'bg-green-50 hover:bg-green-100';
      if (n === 3) return 'bg-yellow-50 hover:bg-yellow-100';
      return 'bg-red-50 hover:bg-red-100';
    }

    function ratingClass(n) {
      if (n >= 4) return 'text-green-700';
      if (n === 3) return 'text-yellow-700';
      return 'text-red-700';
    }

    function render() {
      const all = JSON.parse(localStorage.getItem('feedbackEntries') || '[]');
      const sorted = [...all].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

      const location  = document.getElementById('filterLocation').value;
      const minRating = Number(document.getElementById('filterRating').value);
      const fromVal   = document.getElementById('filterFrom').value;   // 'YYYY-MM-DD' or ''
      const toVal     = document.getElementById('filterTo').value;

      const fromDate = fromVal ? new Date(fromVal + 'T00:00:00') : null;
      const toDate   = toVal   ? new Date(toVal   + 'T23:59:59') : null;

      const filtered = sorted.filter(e => {
        if (location && e.location !== location) return false;
        if (e.rating < minRating) return false;
        const ts = new Date(e.timestamp);
        if (fromDate && ts < fromDate) return false;
        if (toDate   && ts > toDate)   return false;
        return true;
      });

      const wrap = document.getElementById('tableWrap');

      const summary = `<p class="mb-3 text-sm text-gray-500">
        Hiển thị <span class="font-semibold text-gray-800">${filtered.length}</span>
        / <span class="font-semibold text-gray-800">${sorted.length}</span> phản hồi
      </p>`;

      if (sorted.length === 0) {
        wrap.innerHTML = `<div class="text-center py-16 text-gray-400 text-sm">Chưa có phản hồi nào.</div>`;
        return;
      }

      if (filtered.length === 0) {
        wrap.innerHTML = summary + `<div class="text-center py-16 text-gray-400 text-sm">Không có phản hồi nào khớp với bộ lọc.</div>`;
        return;
      }

      const rows = filtered.map(e => `
        <tr class="border-t border-gray-100 ${rowBg(e.rating)}">
          <td class="px-4 py-3 text-sm text-gray-500 whitespace-nowrap">${formatDate(e.timestamp)}</td>
          <td class="px-4 py-3 text-sm font-medium text-gray-800">${e.location}</td>
          <td class="px-4 py-3 text-sm font-mono ${ratingClass(e.rating)}" title="${e.rating}/5">${stars(e.rating)}</td>
          <td class="px-4 py-3 text-sm text-gray-600">${e.name || '<span class="text-gray-300">—</span>'}</td>
          <td class="px-4 py-3 text-sm text-gray-700">${e.comment}</td>
        </tr>`).join('');

      wrap.innerHTML = summary + `
        <div class="overflow-x-auto rounded-xl border border-gray-200 shadow-sm">
          <table class="w-full text-left bg-white">
            <thead class="bg-gray-50 text-xs font-semibold text-gray-500 uppercase tracking-wide">
              <tr>
                <th class="px-4 py-3">Ngày</th>
                <th class="px-4 py-3">Chi nhánh</th>
                <th class="px-4 py-3">Đánh giá</th>
                <th class="px-4 py-3">Tên</th>
                <th class="px-4 py-3">Nhận xét</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }

    ['filterLocation', 'filterRating', 'filterFrom', 'filterTo'].forEach(id => {
      document.getElementById(id).addEventListener('change', render);
    });

    render();
  </script>
</body>
</html>
