<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản Trị — Phản Hồi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../shared/styles.css" />
</head>
<body>
  <script src="../shared/nav.js"></script>

  <div class="page-container">
    <h1>Quản Trị Phản Hồi</h1>

    <div id="tableWrap"></div>
  </div>

  <script>
    function formatDate(isoString) {
      const d = new Date(isoString);
      const dd   = String(d.getDate()).padStart(2, '0');
      const mm   = String(d.getMonth() + 1).padStart(2, '0');
      const yyyy = d.getFullYear();
      const hh   = String(d.getHours()).padStart(2, '0');
      const min  = String(d.getMinutes()).padStart(2, '0');
      return `${dd}/${mm}/${yyyy} ${hh}:${min}`;
    }

    function stars(n) {
      return '★'.repeat(n) + '☆'.repeat(5 - n);
    }

    function ratingClass(n) {
      if (n >= 4) return 'text-green-600';
      if (n === 3) return 'text-yellow-500';
      return 'text-red-500';
    }

    function render() {
      const entries = JSON.parse(localStorage.getItem('feedbackEntries') || '[]');
      const wrap = document.getElementById('tableWrap');

      if (entries.length === 0) {
        wrap.innerHTML = `
          <div class="text-center py-16 text-gray-400 text-sm">
            Chưa có phản hồi nào.
          </div>`;
        return;
      }

      const sorted = [...entries].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

      const rows = sorted.map(e => `
        <tr class="border-t border-gray-100 hover:bg-gray-50">
          <td class="px-4 py-3 text-sm text-gray-500 whitespace-nowrap">${formatDate(e.timestamp)}</td>
          <td class="px-4 py-3 text-sm font-medium text-gray-800">${e.location}</td>
          <td class="px-4 py-3 text-sm font-mono ${ratingClass(e.rating)}" title="${e.rating}/5">${stars(e.rating)}</td>
          <td class="px-4 py-3 text-sm text-gray-600">${e.name || '<span class="text-gray-300">—</span>'}</td>
          <td class="px-4 py-3 text-sm text-gray-700">${e.comment}</td>
        </tr>`).join('');

      wrap.innerHTML = `
        <div class="overflow-x-auto rounded-xl border border-gray-200 shadow-sm">
          <table class="w-full text-left bg-white">
            <thead class="bg-gray-50 text-xs font-semibold text-gray-500 uppercase tracking-wide">
              <tr>
                <th class="px-4 py-3">Ngày</th>
                <th class="px-4 py-3">Chi nhánh</th>
                <th class="px-4 py-3">Đánh giá</th>
                <th class="px-4 py-3">Tên</th>
                <th class="px-4 py-3">Nhận xét</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <p class="mt-3 text-xs text-gray-400 text-right">${sorted.length} phản hồi</p>`;
    }

    render();
  </script>
</body>
</html>
