<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gửi Phản Hồi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../shared/styles.css" />
  <style>
    .star-btn { font-size: 1.75rem; cursor: pointer; color: #d1d5db; transition: color 0.1s; }
    .star-btn.active, .star-btn:hover, .star-btn.hover { color: #f59e0b; }
  </style>
</head>
<body>
  <script src="../shared/nav.js"></script>

  <div class="page-container">
    <h1>Gửi Phản Hồi</h1>

    <!-- Success banner (hidden by default) -->
    <div id="successMsg" class="hidden mb-6 p-4 bg-green-100 border border-green-300 text-green-800 rounded-lg font-medium">
      ✅ Cảm ơn bạn đã gửi phản hồi!
    </div>

    <form id="feedbackForm" novalidate class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 space-y-5">

      <!-- Name -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="name">
          Họ và tên <span class="text-gray-400 font-normal">(không bắt buộc)</span>
        </label>
        <input
          id="name" name="name" type="text"
          placeholder="Nguyễn Văn A"
          maxlength="100"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
        />
      </div>

      <!-- Location -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="location">
          Chi nhánh <span class="text-red-500">*</span>
        </label>
        <select
          id="location" name="location" required
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white"
        >
          <option value="">-- Chọn chi nhánh --</option>
          <option value="Hà Nội">Hà Nội</option>
          <option value="Đà Nẵng">Đà Nẵng</option>
          <option value="TP.HCM">TP.HCM</option>
        </select>
        <p id="locationError" class="hidden mt-1 text-xs text-red-500">Vui lòng chọn chi nhánh.</p>
      </div>

      <!-- Rating -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Đánh giá <span class="text-red-500">*</span>
        </label>
        <div id="starWidget" class="flex gap-1" role="group" aria-label="Chọn số sao">
          <button type="button" class="star-btn" data-value="1" aria-label="1 sao">★</button>
          <button type="button" class="star-btn" data-value="2" aria-label="2 sao">★</button>
          <button type="button" class="star-btn" data-value="3" aria-label="3 sao">★</button>
          <button type="button" class="star-btn" data-value="4" aria-label="4 sao">★</button>
          <button type="button" class="star-btn" data-value="5" aria-label="5 sao">★</button>
        </div>
        <input type="hidden" id="rating" name="rating" value="" />
        <p id="ratingError" class="hidden mt-1 text-xs text-red-500">Vui lòng chọn số sao.</p>
      </div>

      <!-- Comment -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="comment">
          Nhận xét <span class="text-red-500">*</span>
        </label>
        <textarea
          id="comment" name="comment" required rows="4"
          placeholder="Chia sẻ trải nghiệm của bạn..."
          maxlength="1000"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 resize-y"
        ></textarea>
        <p id="commentError" class="hidden mt-1 text-xs text-red-500">Vui lòng nhập nhận xét.</p>
      </div>

      <!-- Submit -->
      <button
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition-colors text-sm"
      >
        Gửi Phản Hồi
      </button>

    </form>
  </div>

  <script>
    const VALID_LOCATIONS = ['Hà Nội', 'Đà Nẵng', 'TP.HCM'];
    const COOLDOWN_MS     = 60_000;
    let lastSubmitTime    = 0;

    // --- Star widget ---
    const stars       = document.querySelectorAll('.star-btn');
    const ratingInput = document.getElementById('rating');

    function setStars(value) {
      stars.forEach(s => s.classList.toggle('active', Number(s.dataset.value) <= value));
    }

    stars.forEach(star => {
      star.addEventListener('click', () => {
        ratingInput.value = star.dataset.value;
        setStars(Number(star.dataset.value));
      });
      star.addEventListener('mouseenter', () => setStars(Number(star.dataset.value)));
      star.addEventListener('mouseleave', () => setStars(Number(ratingInput.value) || 0));
    });

    function showError(id, show) {
      document.getElementById(id).classList.toggle('hidden', !show);
    }

    // --- Form submit ---
    document.getElementById('feedbackForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const location = document.getElementById('location').value.trim();
      const rating   = ratingInput.value;
      const comment  = document.getElementById('comment').value.trim();
      const name     = document.getElementById('name').value.trim();

      let valid = true;
      showError('locationError', !location || !VALID_LOCATIONS.includes(location));
      if (!location || !VALID_LOCATIONS.includes(location)) valid = false;
      showError('ratingError', !rating);
      if (!rating) valid = false;
      showError('commentError', !comment);
      if (!comment) valid = false;
      if (!valid) return;

      // Cooldown check
      const now = Date.now();
      if (now - lastSubmitTime < COOLDOWN_MS) {
        const remaining = Math.ceil((COOLDOWN_MS - (now - lastSubmitTime)) / 1000);
        showErrorBanner(`Vui lòng đợi ${remaining} giây trước khi gửi lại.`);
        return;
      }

      const submitBtn = this.querySelector('[type="submit"]');
      submitBtn.disabled    = true;
      submitBtn.textContent = 'Đang gửi...';
      hideErrorBanner();

      try {
        const res = await fetch('/api/feedback', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({
            name:     name.slice(0, 100) || null,
            location,
            rating:   Number(rating),
            comment:  comment.slice(0, 1000),
          }),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.error || res.statusText);
        }
        lastSubmitTime = Date.now();

        document.getElementById('successMsg').classList.remove('hidden');
        this.reset();
        ratingInput.value = '';
        setStars(0);
        setTimeout(() => document.getElementById('successMsg').classList.add('hidden'), 5000);
      } catch (err) {
        showErrorBanner('Gửi thất bại: ' + err.message);
      } finally {
        submitBtn.disabled    = false;
        submitBtn.textContent = 'Gửi Phản Hồi';
      }
    });

    function showErrorBanner(msg) {
      let banner = document.getElementById('errorBanner');
      if (!banner) {
        banner = document.createElement('div');
        banner.id        = 'errorBanner';
        banner.className = 'mb-4 p-4 bg-red-100 border border-red-300 text-red-800 rounded-lg text-sm font-medium';
        document.getElementById('feedbackForm').before(banner);
      }
      banner.textContent = '❌ ' + msg;
      banner.classList.remove('hidden');
    }

    function hideErrorBanner() {
      const banner = document.getElementById('errorBanner');
      if (banner) banner.classList.add('hidden');
    }
  </script>
</body>
</html>
